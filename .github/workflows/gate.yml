# Portfolio Standard gate — generated by @caistech/portfolio-migrator
#
# Runs typecheck + lint + build, all blocking static audits, then a route
# smoke test against the preview deploy URL. Fails the action on any non-zero exit.
#
# Closes Portfolio Standard:
#   R3  — Explanatory header on every page (audit blocking)
#   R7/R9 — Unauthenticated endpoint surface check (audit blocking)
#   R9  — RLS enabled on every table (audit blocking)
#   R10 — No verbatim Postgres errors (errorResponse helper, enforced at code level)
#   R11 — Vendor-identity leak check (audit blocking; whitelist via vendor-leak.config.json)
#   R13 — Route smoke test on every deploy (route smoke step)
#   R14 — Sample artefact present (audit blocking; configured via sample.config.json)
#   R15 — Trust panel for regulated products (audit auto-skips for `standard` tier)
#   responsive-design — Mobile + laptop viewport check (audit blocking; Playwright chromium)
#
# R1 (auth four-leg pattern) is N/A on this repo — see the comment block
# at the bottom of the file where the auth smoke step would otherwise live.

name: portfolio-gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORTFOLIO_GATE_PREVIEW_URL: ${{ vars.PORTFOLIO_GATE_PREVIEW_URL }}
      # Supabase env required by next build's page-data collection on routes
      # that instantiate a Supabase client at module-load (e.g. /api/investors).
      # Without these, the Build step fails before audits/smoke run.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect package manager so the cache step + install step use the
      # right tooling. Pnpm workspaces (TourLingo, NDISSDA, F2K trio) need
      # pnpm/action-setup before setup-node can use the `cache: pnpm` key.
      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node with built-in @caistech registry auth (official pattern).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ steps.detect-pm.outputs.pm }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caistech'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Verify preview URL is set
        run: |
          if [ -z "$PORTFOLIO_GATE_PREVIEW_URL" ]; then
            echo "::error::PORTFOLIO_GATE_PREVIEW_URL is not set. Wire it via repo vars or a preview-deploy step."
            exit 1
          fi
          echo "Preview URL: $PORTFOLIO_GATE_PREVIEW_URL"

      # Playwright chromium for the responsive audit. `playwright` lands in
      # node_modules as a transitive dep; this step downloads the browser
      # binary it needs to launch.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Static audits — BLOCKING.
      # `portfolio-gate-audit-all` ignores per-audit config files (passes
      # configPath: null to each runner), so invoking each audit individually
      # is the only way to honor vendor-leak.config.json and sample.config.json.
      # Aggregating exit codes so all findings surface even if one fails.
      - name: Static audits (R3 / R9 / R11 / R14 / R15 / responsive)
        run: |
          FAIL=0
          npx --no-install portfolio-gate-audit-rls                                                       || FAIL=1
          npx --no-install portfolio-gate-audit-vendor-leak       --config vendor-leak.config.json       || FAIL=1
          npx --no-install portfolio-gate-audit-unauth-endpoints  --base-url "$PORTFOLIO_GATE_PREVIEW_URL" || FAIL=1
          npx --no-install portfolio-gate-audit-sample-artefact   --config sample.config.json --base-url "$PORTFOLIO_GATE_PREVIEW_URL" || FAIL=1
          npx --no-install portfolio-gate-audit-explanatory-header                                       || FAIL=1
          npx --no-install portfolio-gate-audit-trust-panel                                              || FAIL=1
          npx --no-install portfolio-gate-audit-responsive        --config responsive.config.json --base-url "$PORTFOLIO_GATE_PREVIEW_URL" || FAIL=1
          exit $FAIL

      - name: Route smoke test (Portfolio Standard R13)
        run: |
          npx --no-install portfolio-gate-smoke-routes \
            --config routes.config.json \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Auth smoke (R1/R4) is intentionally OMITTED on this repo.
      # corporate-ai-solutions is a marketing + marketplace site with no
      # user-facing auth flow (no /login, /signup, /forgot-password). The
      # AUTH PAGE PATTERN rule in CLAUDE.md applies to apps that ship
      # authentication; this site only collects lead submissions via
      # public API routes. Restore the step if/when auth pages are added.
